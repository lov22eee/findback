
services:
  # Flask 웹 애플리케이션
  web:
    build: .
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - findback_data:/app/data

  # Nginx 웹서버
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

# SQLite 데이터 저장 공간
volumes:
  findback_data:
